<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="wpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43D6A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6BA8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#050b14"/>
  <!-- The phases of a job, in order -->
  <line x1="7" y1="14" x2="25" y2="14" stroke="url(#wpGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- The failure edge loops back -->
  <path d="M25 17 Q25 23 16 23 Q7 23 7 17" fill="none" stroke="url(#wpGrad)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
  <!-- Phase nodes -->
  <circle cx="7" cy="14" r="3" fill="#43D6A6"/>
  <circle cx="16" cy="14" r="4" fill="white"/>
  <circle cx="25" cy="14" r="3" fill="#6BA8FF"/>
</svg>
